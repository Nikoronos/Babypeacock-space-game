<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Babypeacock — BPC Space Evolution</title>
<style>
  html,body{margin:0;height:100%;background:#000;font-family:system-ui,Segoe UI,Roboto,Arial;overflow:hidden}
  #ui-layer {
    position: fixed; top: 0; left: 0; right: 0;
    height: 55px; padding: max(10px, env(safe-area-inset-top)) 15px 0 15px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    z-index: 20; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    font-size: 15px; font-weight: 800; white-space: nowrap; 
  }
  #brand { justify-self: start; background:linear-gradient(90deg,#22d3ee,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent; font-weight: 900; font-size: 17px; }
  .center-group { justify-self: center; display: flex; gap: 15px; }
  #score { color:#00ffc8; font-size: 18px; }
  #lives { letter-spacing: 2px; min-width: 60px; text-align: center; }
  #power { justify-self: end; color:#a7f3d0; font-size: 16px; }
  #pauseBtn{ display:none; position:fixed; left:50%; transform:translateX(-50%); bottom:max(20px,env(safe-area-inset-bottom)); z-index:50; width:42px; height:42px; background:rgba(15, 23, 42, 0.95); border:2px solid #38bdf8; color:#38bdf8; border-radius:50%; font-size:14px; font-weight:900; align-items:center; justify-content:center; cursor:pointer; }
  #startOverlay,#gameOver,#pauseOverlay,#countdownOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:60}
  #startOverlay{background:rgba(0,0,0,0.85);color:#fff;display:flex;}
  #pauseOverlay{background:rgba(0,0,0,0.9);color:#fff;}
  #startLogo { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #22d3ee; margin-bottom: 8px; }
  .btn{padding:12px 32px;border:1px solid #00ffc8;background:#0b1220;color:#00ffc8;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px;}
  #countdownOverlay{background:transparent;pointer-events:none;z-index:70}
  #cntText{font-size:90px;font-weight:900;color:#fff;text-shadow:0 0 25px #22d3ee;}
  canvas { display: block; background: radial-gradient(circle at center, #0f172a 0%, #000 100%); touch-action: none; width: 100%; height: 100%; }
  .red-zone { background: radial-gradient(circle at center, #2e1065 0%, #000 100%) !important; }
</style>
</head>
<body>
  <div id="ui-layer">
    <div id="brand">BPC Space 🦚</div>
    <div class="center-group">
      <div id="score">Score: <span id="sc">0</span></div>
      <div id="lives">❤️❤️❤️</div>
    </div>
    <div id="power">💎 <span id="px">0</span>s</div>
  </div>

  <div id="pauseBtn">II</div>

  <div id="startOverlay">
    <img id="startLogo" src="yc3ku6.jpg" alt="BPC Logo">
    <div style="margin-bottom:12px;font-size:14px;color:#ccc;">Drag to move anywhere!</div>
    <button id="startBtn" class="btn">START GAME</button>
  </div>

  <div id="pauseOverlay">
    <div style="font-size:32px;font-weight:900;margin-bottom:15px;color:#fff;">PAUSED</div>
    <button id="resumeBtn" class="btn">RESUME</button>
  </div>

  <div id="countdownOverlay"><div id="cntText"></div></div>

  <div id="gameOver">
    <h1 style="color:#ff5c5c; font-size:40px;">GAME OVER</h1>
    <button id="restart" class="btn">RESTART</button>
  </div>

  <canvas id="game"></canvas>

<script>
const cv=document.getElementById("game");
const ctx=cv.getContext("2d");
let player={x:0,y:0,w:60,h:60};
let bullets=[], enemies=[], enemyBullets=[], gems=[], mascots=[], particles=[];
let score=0, lives=3, started=false, gameOver=false, paused=false, inCountdown=false;
let powerTime=0, fireTimer=0, FIRE_MS=150;

function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
window.addEventListener('resize', resize); resize();

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rand(a,b){return a+Math.random()*(b-a);}
function rectHit(a,b){return !(a.x+a.w<b.x||a.x>b.x+b.w||a.y+a.h<b.y||a.y>b.y+b.h);}

// --- SERBEST HAREKET KONTROLÜ ---
let holding = false;
const handleMove = (e) => {
  if(!holding || paused || inCountdown || !started) return;
  const clientX = e.clientX ?? e.touches[0].clientX;
  const clientY = e.clientY ?? e.touches[0].clientY;
  player.x = clamp(clientX - player.w/2, 0, cv.width - player.w);
  player.y = clamp(clientY - player.h/2, 0, cv.height - player.h);
};
cv.addEventListener("pointerdown", e => { holding=true; handleMove(e); });
cv.addEventListener("pointermove", handleMove);
cv.addEventListener("pointerup", () => holding=false);

function shoot(){
  const bCount = powerTime > 0 ? 3 : 1;
  if(bCount === 3){
    bullets.push({x:player.x+player.w/2-2, y:player.y, w:5, h:15, vy:-12, vx:-3});
    bullets.push({x:player.x+player.w/2-2, y:player.y, w:5, h:15, vy:-12, vx:0});
    bullets.push({x:player.x+player.w/2-2, y:player.y, w:5, h:15, vy:-12, vx:3});
  } else {
    bullets.push({x:player.x+player.w/2-2, y:player.y, w:5, h:15, vy:-12, vx:0});
  }
}

function spawnEnemy(){
  const size = rand(50, 80);
  // Düşman canı (HP) skora göre artar
  const hpBase = Math.floor(score / 50) + 1;
  enemies.push({
    x: rand(0, cv.width-size), y: -size, w: size, h: size,
    vy: rand(1.5, 3), hp: Math.floor(rand(hpBase, hpBase * 3)),
    color: `hsl(${rand(0,360)}, 70%, 60%)`
  });
}

function update(dt){
  if(!started || gameOver || paused || inCountdown) return;
  
  fireTimer += dt;
  if(fireTimer > FIRE_MS){ shoot(); fireTimer=0; }
  
  if(Math.random() < 0.02) spawnEnemy();
  if(powerTime > 0) powerTime -= dt;

  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
  enemies.forEach(e => { e.y += e.vy; });
  
  // Çarpışma ve HP Sistemi
  bullets.forEach(b => {
    enemies.forEach(e => {
      if(rectHit(b,e)){
        b.dead = true;
        e.hp--;
        if(e.hp <= 0){
          e.dead = true;
          score++;
          document.getElementById("sc").textContent = score;
        }
      }
    });
  });

  // Gemi düşmana çarparsa
  enemies.forEach(e => {
    if(rectHit(player, e)){
      e.dead = true;
      lives--;
      document.getElementById("lives").innerHTML = "❤️".repeat(lives);
      if(lives <= 0) gameOver = true;
    }
  });

  bullets = bullets.filter(b => !b.dead && b.y > -20);
  enemies = enemies.filter(e => !e.dead && e.y < cv.height + 50);
}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  
  // Gemi (Peacock)
  ctx.fillStyle = "#22d3ee";
  ctx.shadowBlur = 15; ctx.shadowColor = "#22d3ee";
  ctx.fillRect(player.x, player.y, player.w, player.h);
  
  // Mermiler
  ctx.fillStyle = "#fff";
  ctx.shadowBlur = 5;
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  // Sayılı Düşmanlar
  enemies.forEach(e => {
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 3;
    ctx.shadowBlur = 10; ctx.shadowColor = e.color;
    ctx.strokeRect(e.x, e.y, e.w, e.h);
    
    // HP Yazısı
    ctx.fillStyle = "#fff";
    ctx.font = "bold 20px system-ui";
    ctx.textAlign = "center";
    ctx.shadowBlur = 0;
    ctx.fillText(e.hp, e.x + e.w/2, e.y + e.h/2 + 7);
  });

  if(gameOver){
    document.getElementById("gameOver").style.display = "flex";
  }
}

function loop(t){
  const dt = t - (window._lt || t); window._lt = t;
  update(dt); draw();
  requestAnimationFrame(loop);
}

document.getElementById("startBtn").onclick = () => {
  started = true;
  player.x = cv.width/2 - 30; player.y = cv.height - 100;
  document.getElementById("startOverlay").style.display = "none";
  document.getElementById("pauseBtn").style.display = "flex";
  requestAnimationFrame(loop);
};

document.getElementById("restart").onclick = () => location.reload();
</script>
</body>
</html>
