<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Babypeacock — BPC Space Evolution</title>
<style>
  html,body{margin:0;height:100%;background:#000;font-family:system-ui,Segoe UI,Roboto,Arial;overflow:hidden}
  #ui-layer {
    position: fixed; top: 0; left: 0; right: 0;
    height: 55px; padding: max(10px, env(safe-area-inset-top)) 15px 0 15px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    z-index: 20; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    font-size: 15px; font-weight: 800; white-space: nowrap; 
  }
  #brand { justify-self: start; background:linear-gradient(90deg,#22d3ee,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent; font-weight: 900; font-size: 17px; }
  .center-group { justify-self: center; display: flex; align-items: center; gap: 15px; }
  #score { color:#00ffc8; font-size: 18px; }
  #lives { letter-spacing: 2px; min-width: 60px; text-align: center; }
  #power { justify-self: end; color:#a7f3d0; font-size: 16px; }
  #pauseBtn{ display:none; position:fixed; left:50%; transform:translateX(-50%); bottom:max(20px,env(safe-area-inset-bottom)); z-index:50; width:42px; height:42px; background:rgba(15, 23, 42, 0.95); border:2px solid #38bdf8; color:#38bdf8; border-radius:50%; font-size:14px; font-weight:900; align-items:center; justify-content:center; cursor:pointer; }
  #startOverlay,#gameOver,#pauseOverlay,#countdownOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:60}
  #startOverlay{background:rgba(0,0,0,0.85);color:#fff;display:flex;}
  #pauseOverlay{background:rgba(0,0,0,0.9);color:#fff;}
  #startLogo { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #22d3ee; margin-bottom: 8px; animation: floatLogo 3s ease-in-out infinite;}
  @keyframes floatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .btn{padding:12px 32px;border:1px solid #00ffc8;background:#0b1220;color:#00ffc8;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px;box-shadow:0 0 15px rgba(0,255,200,0.3);}
  #cntText{font-size:90px;font-weight:900;color:#fff;text-shadow:0 0 25px #22d3ee;}
  canvas { display: block; background: radial-gradient(circle at center, #0f172a 0%, #000 100%); touch-action: none; width: 100%; height: 100%; transition: background 2s;}
  .red-zone { background: radial-gradient(circle at center, #2e1065 0%, #000 100%) !important; }
</style>
</head>
<body>
  <div id="ui-layer">
    <div id="brand">BPC Space 🦚</div>
    <div class="center-group">
      <div id="score">Score: <span id="sc">0</span></div>
      <div id="lives">❤️❤️❤️</div>
    </div>
    <div id="power">💎 <span id="px">0</span>s</div>
  </div>

  <div id="pauseBtn">II</div>

  <div id="startOverlay">
    <img id="startLogo" src="yc3ku6.jpg" alt="BPC Logo">
    <div style="margin-bottom:12px;font-size:14px;color:#ccc;">Hold & Drag Anywhere!</div>
    <button id="startBtn" class="btn">START GAME</button>
  </div>

  <div id="pauseOverlay">
    <div style="font-size:32px;font-weight:900;margin-bottom:15px;color:#fff;">PAUSED</div>
    <button id="resumeBtn" class="btn">RESUME</button>
  </div>

  <div id="countdownOverlay"><div id="cntText"></div></div>

  <div id="gameOver" style="background:rgba(0,0,0,0.8);">
    <h1 style="color:#ff5c5c; font-size:40px; margin-bottom:5px;">GAME OVER</h1>
    <div id="finalScore" style="color:#fff; font-size:24px; margin-bottom:20px;">Score: 0</div>
    <button id="restart" class="btn">RESTART</button>
  </div>

  <canvas id="game"></canvas>

<script>
// --- AYARLAR & GÖRSELLER ---
const cv=document.getElementById("game");
const ctx=cv.getContext("2d");
const PLAYER_SRC="img/player/bpc_mini.png";
const PEACOCK_SRC="yc3ku6.jpg";
const SPRITE_CONFIG = {
  green:   { src: "bpc_enemy_green_sprite.png", frames: 60 }, 
  ufo_red: { src: "ufo_red_sprite.png", frames: 85 },
  ufo_gray:{ src: "ufo_gray_sprite.png", frames: 60 },
  red:     { src: "bpc_enemy_red_sprite.png", frames: 60 } 
};

let playerImg, peacockImg, loadedSprites = {};
let player={x:0,y:0,w:66,h:66};
let bullets=[], enemies=[], enemyBullets=[], gems=[], mascots=[], particles=[];
let score=0, lives=3, started=false, gameOver=false, paused=false, inCountdown=false;
let powerTime=0, fireTimer=0, FIRE_MS=160;

function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
window.addEventListener('resize', resize); resize();

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rand(a,b){return a+Math.random()*(b-a);}
function rectHit(a,b){return !(a.x+a.w<b.x||a.x>b.x+b.w||a.y+a.h<b.y||a.y>b.y+b.h);}

async function loadImage(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.src=src;});}

// --- SERBEST HAREKET (Y EKSENİ DAHİL) ---
let holding = false;
const handleMove = (e) => {
  if(!holding || paused || inCountdown || !started) return;
  const rect = cv.getBoundingClientRect();
  const clientX = (e.clientX ?? e.touches[0].clientX) - rect.left;
  const clientY = (e.clientY ?? e.touches[0].clientY) - rect.top;
  player.x = clamp(clientX - player.w/2, 0, cv.width - player.w);
  player.y = clamp(clientY - player.h/2, 0, cv.height - player.h);
};
cv.addEventListener("pointerdown", e => { holding=true; handleMove(e); });
cv.addEventListener("pointermove", handleMove);
window.addEventListener("pointerup", () => holding=false);

function spawnEnemy(){
  const kinds = Object.keys(SPRITE_CONFIG);
  const kind = kinds[Math.floor(Math.random()*kinds.length)];
  const size = rand(55, 75);
  // HP Sistemi: Skora göre düşman canı artar
  const hpBase = Math.floor(score / 60) + 1;
  
  enemies.push({
    x: rand(0, cv.width-size), y: -size, w: size, h: size,
    vy: rand(1.6, 3.2), kind, 
    hp: Math.floor(rand(hpBase, hpBase * 2.5)),
    frame: 0, frameTimer: 0
  });
}

function shoot(){
  const bX = player.x + player.w/2 - 2;
  if(powerTime > 0){
    bullets.push({x:bX, y:player.y, w:5, h:15, vy:-12, vx:-2});
    bullets.push({x:bX, y:player.y, w:5, h:15, vy:-12, vx:0});
    bullets.push({x:bX, y:player.y, w:5, h:15, vy:-12, vx:2});
  } else {
    bullets.push({x:bX, y:player.y, w:5, h:15, vy:-12, vx:0});
  }
}

function update(dt){
  if(!started || gameOver || paused || inCountdown) return;
  
  fireTimer += dt;
  if(fireTimer > FIRE_MS){ shoot(); fireTimer=0; }
  
  if(Math.random() < 0.025) spawnEnemy();
  if(powerTime > 0) powerTime -= dt;
  document.getElementById("px").textContent = Math.ceil(powerTime/1000);

  bullets.forEach(b => { b.x += (b.vx || 0); b.y += b.vy; });
  enemies.forEach(e => {
    e.y += e.vy;
    e.frameTimer += dt;
    if(e.frameTimer > 40) { e.frame = (e.frame + 1) % SPRITE_CONFIG[e.kind].frames; e.frameTimer = 0; }
  });

  // Mermi - Düşman HP Çarpışması
  bullets.forEach(b => {
    enemies.forEach(e => {
      if(!b.dead && !e.dead && rectHit(b,e)){
        b.dead = true;
        e.hp--;
        if(e.hp <= 0){
          e.dead = true;
          score++;
          document.getElementById("sc").textContent = score;
        }
      }
    });
  });

  // Gemi - Düşman Çarpışması
  enemies.forEach(e => {
    if(!e.dead && rectHit(player, e)){
      e.dead = true;
      lives--;
      document.getElementById("lives").innerHTML = "❤️".repeat(Math.max(0, lives));
      if(lives <= 0) { gameOver = true; document.getElementById("finalScore").textContent = "Score: " + score; document.getElementById("gameOver").style.display="flex"; }
    }
  });

  bullets = bullets.filter(b => !b.dead && b.y > -20);
  enemies = enemies.filter(e => !e.dead && e.y < cv.height + 50);
  
  if(score >= 1500) cv.classList.add("red-zone");
}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  
  // Arka Plan Yıldızlar (Basit)
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  for(let i=0; i<20; i++) ctx.fillRect((i*77)%cv.width, (Date.now()/20 + i*100)%cv.height, 2, 2);

  // Gemi (BPC Mini)
  if(playerImg) ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);

  // Mermiler
  ctx.fillStyle = "#00ffc8";
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  // Düşmanlar (Sprite + HP)
  enemies.forEach(e => {
    const conf = SPRITE_CONFIG[e.kind];
    const img = loadedSprites[e.kind];
    if(img){
      const fw = img.width / conf.frames;
      ctx.drawImage(img, e.frame * fw, 0, fw, img.height, e.x, e.y, e.w, e.h);
    }
    
    // HP Yazısı (Tam üzerine)
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "center";
    ctx.fillText(e.hp, e.x + e.w/2, e.y + e.h/2 + 6);
  });
}

function loop(t){
  const dt = t - (window._lt || t); window._lt = t;
  update(dt); draw();
  requestAnimationFrame(loop);
}

// --- BAŞLATMA ---
(async function init(){
  playerImg = await loadImage(PLAYER_SRC);
  peacockImg = await loadImage(PEACOCK_SRC);
  for(const k in SPRITE_CONFIG) loadedSprites[k] = await loadImage(SPRITE_CONFIG[k].src);
  
  document.getElementById("startBtn").onclick = () => {
    started = true;
    player.x = cv.width/2 - player.w/2; player.y = cv.height - 150;
    document.getElementById("startOverlay").style.display = "none";
    document.getElementById("pauseBtn").style.display = "flex";
    requestAnimationFrame(loop);
  };
})();

document.getElementById("restart").onclick = () => location.reload();
</script>
</body>
</html>
