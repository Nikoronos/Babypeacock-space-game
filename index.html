<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Babypeacock — BPC Space Master</title>
<style>
  html,body{margin:0;height:100%;background:#000;font-family:system-ui,Segoe UI,Roboto,Arial;overflow:hidden}
  #ui-layer { position: fixed; top: 0; left: 0; right: 0; height: 55px; padding: max(10px, env(safe-area-inset-top)) 15px 0 15px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; z-index: 20; pointer-events: none; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); font-size: 15px; font-weight: 800; white-space: nowrap; }
  #brand { justify-self: start; background:linear-gradient(90deg,#22d3ee,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent; font-weight: 900; font-size: 17px; }
  .center-group { justify-self: center; display: flex; align-items: center; gap: 15px; }
  #score { color:#00ffc8; text-shadow: 0 0 6px rgba(0, 255, 200, 0.5); font-size: 18px; }
  #lives { letter-spacing: 2px; font-size: 15px; min-width: 60px; text-align: center; }
  #power { justify-self: end; color:#a7f3d0; font-size: 16px; }
  
  #startOverlay,#gameOver,#pauseOverlay,#countdownOverlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:60}
  #startOverlay{background:#000;color:#fff;}
  #pauseOverlay{background:rgba(0,0,0,0.9);display:none;}
  #gameOver{background:rgba(0,0,0,0.95);display:none;padding-top:20vh;overflow-y:auto;}
  
  #startLogo { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #22d3ee; margin-bottom: 8px; }
  .btn{padding:12px 32px;border:1px solid #00ffc8;background:#0b1220;color:#00ffc8;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px;box-shadow:0 0 15px rgba(0,255,200,0.3);}
  #cntText{font-size:90px;font-weight:900;color:#fff;text-shadow:0 0 25px #22d3ee;}
  #countdownOverlay{pointer-events:none;display:none;}
  
  canvas { display: block; background: radial-gradient(circle at center, #0f172a 0%, #000 100%); touch-action: none; width: 100%; height: 100%; }
  #bpc-top10 { width: min(380px, 90vw); background: rgba(5, 5, 5, 0.9); border: 1px solid #333; border-radius: 10px; padding: 10px; color: #fff; font-size: 13px; margin-top: 20px; }
  #bpc-top10 ol { list-style:none; padding:0; margin:0; }
  #bpc-top10 li { display:flex; justify-content:space-between; border-bottom:1px solid #222; padding:4px 0; }
</style>
</head>
<body>
  <div id="ui-layer">
    <div id="brand">Babypeacock</div>
    <div class="center-group">
      <div id="score">Score: <span id="sc">0</span></div>
      <div id="lives">❤️❤️❤️</div>
    </div>
    <div id="power">💎 <span id="px">0</span>s</div>
  </div>

  <div id="startOverlay">
    <img id="startLogo" src="yc3ku6.jpg">
    <div style="color:#22d3ee; font-style:italic; margin-bottom:20px;">From feather to flight</div>
    <button id="startBtn" class="btn">START GAME</button>
  </div>

  <div id="pauseOverlay">
    <div style="font-size:32px; font-weight:900; color:#fff;">PAUSED</div>
    <button id="resumeBtn" class="btn">RESUME</button>
  </div>

  <div id="countdownOverlay"><div id="cntText"></div></div>

  <div id="gameOver">
    <h1 style="color:#ff5c5c; font-size:48px; margin:0;">GAME OVER</h1>
    <button onclick="location.reload()" class="btn">RESTART</button>
    <div id="bpc-top10">
      <h4 style="text-align:center;margin:0 0 10px 0;">🏆 Weekly Top 10</h4>
      <ol id="bpc-list"></ol>
    </div>
  </div>

  <canvas id="game"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({ databaseURL: "https://bpc-space-default-rtdb.europe-west1.firebasedatabase.app/" });
const db = getDatabase(app);

/* --- OYUN AYARLARI --- */
const cv=document.getElementById("game"), ctx=cv.getContext("2d");
let player={x:0,y:0,w:66,h:66}, bullets=[], enemies=[], stars=[], started=false, gameOver=false, paused=false;
let score=0, lives=3, powerTime=0, enT=0, fireTimer=0, lt=0;
let playerImg, loadedSprites = {};

function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
window.onresize=resize; resize();

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rectHit(a,b){return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;}

/* --- ASSET YÜKLEME --- */
function loadImage(src){
  return new Promise(res => {
    const i = new Image();
    i.crossOrigin = "anonymous";
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}

async function init(){
  playerImg = await loadImage("img/player/bpc_mini.png");
  // Sprite listesi
  const list = { ufo:"ufo_red_sprite.png", green:"bpc_enemy_green_sprite.png", red:"bpc_enemy_red_sprite.png" };
  for(let k in list) loadedSprites[k] = await loadImage(list[k]);
  console.log("Assets Loaded");
}

/* --- DÜŞMAN MOTORU (YILAN SİSTEMİ DAHİL) --- */
function spawnEnemy() {
  if (score >= 300 && score < 1000) {
    // YILAN MODU (Snake vs Block)
    let len = 6 + Math.floor(Math.random()*4);
    let startX = Math.random()*(cv.width-80);
    let offset = Math.random()*2000;
    let color = `hsl(${Math.random()*360}, 80%, 60%)`;
    for(let i=0; i<len; i++) {
      enemies.push({ 
        x:startX, y:-i*65-100, w:60, h:60, vy:3, 
        type:"snake", hp:Math.floor(Math.random()*12+5), 
        maxHp:0, offset, color, sides:Math.floor(Math.random()*3+5)
      });
    }
  } else {
    // NORMAL VE KLASİK (1000+)
    let isClassic = score >= 1000;
    let kind = isClassic ? ["ufo","green","red"][Math.floor(Math.random()*3)] : "ufo";
    let size = 60;
    enemies.push({ 
      x:Math.random()*(cv.width-size), y:-size, w:size, h:size, 
      vy:isClassic?5:2.5, type:"classic", kind, hp:1 
    });
  }
}

/* --- KONTROLLER --- */
let holding=false;
const move = (e) => {
  const cx = (e.clientX ?? e.touches[0].clientX);
  const cy = (e.clientY ?? e.touches[0].clientY);
  player.x = clamp(cx - player.w/2, 0, cv.width - player.w);
  player.y = clamp(cy - player.h/2, 0, cv.height - player.h);
};
cv.addEventListener("pointerdown", e => { holding=true; move(e); });
cv.addEventListener("pointermove", e => { if(holding) move(e); });
cv.addEventListener("pointerup", () => holding=false);

/* --- ANA DÖNGÜ --- */
function update(dt){
  if(!started || paused || gameOver) return;
  enT += dt; fireTimer += dt;
  let rate = (score >= 300 && score < 1000) ? 2500 : 800;
  if(enT > rate){ spawnEnemy(); enT=0; }
  
  if(holding && fireTimer > 150){
    bullets.push({x:player.x+player.w/2-2, y:player.y, w:4, h:12, vy:-12});
    fireTimer=0;
  }
  
  bullets.forEach(b=>b.y+=b.vy);
  enemies.forEach(e=>{
    e.y += e.vy;
    if(e.type==="snake") e.x += Math.sin(e.y*0.01 + e.offset)*5;
    if(rectHit(player, e)){
      lives--; e.dead=true;
      document.getElementById("lives").innerHTML="❤️".repeat(Math.max(0,lives));
      if(lives<=0) { gameOver=true; document.getElementById("gameOver").style.display="flex"; saveScore(); }
    }
  });

  bullets.forEach(b=>{
    enemies.forEach(e=>{
      if(!b.dead && !e.dead && rectHit(b,e)){
        b.dead=true; e.hp--;
        if(e.hp<=0){ 
            e.dead=true; 
            score += (e.type==="snake" ? 5 : 1); 
            document.getElementById("sc").textContent=score; 
        }
      }
    });
  });
  enemies=enemies.filter(e=>!e.dead && e.y<cv.height+200);
  bullets=bullets.filter(b=>!b.dead && b.y>-20);
}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(playerImg) ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);
  else { ctx.fillStyle="cyan"; ctx.fillRect(player.x,player.y,player.w,player.h); }

  enemies.forEach(e=>{
    if(e.type==="snake"){
      ctx.strokeStyle=e.color; ctx.lineWidth=4; 
      ctx.strokeRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle="#fff"; ctx.font="bold 20px Arial"; ctx.textAlign="center";
      ctx.fillText(e.hp, e.x+e.w/2, e.y+e.h/2+7);
    } else {
      ctx.fillStyle="red"; ctx.fillRect(e.x, e.y, e.w, e.h);
    }
  });
  ctx.fillStyle="#00ffc8"; bullets.forEach(b=>ctx.fillRect(b.x, b.y, b.w, b.h));
}

function loop(t){
  if(!lt) lt=t; let dt=t-lt; lt=t;
  update(dt); draw();
  requestAnimationFrame(loop);
}

/* --- FIREBASE İŞLEMLERİ --- */
async function saveScore(){
  const playerCode = localStorage.getItem("playerCode") || "BPC_USER";
  await push(ref(db, "scores"), { code:playerCode, score:score, ts:Date.now() });
  loadTop10();
}

async function loadTop10(){
  const snap = await get(ref(db, "scores"));
  if(snap.exists()){
    const data = Object.values(snap.val()).sort((a,b)=>b.score-a.score).slice(0,10);
    document.getElementById("bpc-list").innerHTML = data.map(i=>`<li><span>${i.code}</span> <span>${i.score}</span></li>`).join("");
  }
}

/* --- BAŞLATMA --- */
document.getElementById("startBtn").onclick = async () => {
  document.getElementById("startOverlay").style.display="none";
  await init();
  started=true;
  player.x=cv.width/2-player.w/2; player.y=cv.height-120;
  requestAnimationFrame(loop);
};
</script>
</body>
</html>
