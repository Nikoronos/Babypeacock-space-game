<style>

<script>
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

class SoundPool {
  constructor(src, size, volume = 1.0) {
    this.buffer = null; this.volume = volume; this.isLoaded = false;
    fetch(src).then(r => r.arrayBuffer()).then(ab => audioCtx.decodeAudioData(ab))
      .then(b => { this.buffer = b; this.isLoaded = true; }).catch(e => console.error("Ses hatası:", src, e));
  }
  play() {
    if (!this.isLoaded) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    try {
      const source = audioCtx.createBufferSource(); source.buffer = this.buffer;
      const gainNode = audioCtx.createGain(); gainNode.gain.value = this.volume;
      source.connect(gainNode); gainNode.connect(audioCtx.destination); source.start(0);
    } catch (e) {}
  }
}

const sounds = {
  normalShot: new SoundPool("laser_one.mp3", 10, 0.25), powerShot:  new SoundPool("laser.mp3", 10, 0.25),   
  boomUfo:    new SoundPool("boom.mp3", 5, 0.6), boomShip:   new SoundPool("boom_one.mp3", 5, 0.6),
  gem:        new SoundPool("gem.mp3", 5, 0.7), coin:       new SoundPool("gem.mp3", 5, 0.4),
  gameOver:   new Audio("space_chords.mp3")
};
sounds.gameOver.loop = false; let gameOverMusicPlayed = false;

let soundEnabled = localStorage.getItem("bpc_sound") !== "0";
const soundBtn = document.getElementById("soundToggle");
function updateSoundIcon() { soundBtn.textContent = soundEnabled ? "🔊" : "🔇"; soundBtn.style.opacity = soundEnabled ? "1" : "0.5"; }
updateSoundIcon();
soundBtn.onclick = (e) => { e.stopPropagation(); soundEnabled = !soundEnabled; localStorage.setItem("bpc_sound", soundEnabled ? "1" : "0"); updateSoundIcon(); };

function playShootSound(isPower) { if (!soundEnabled) return; if (isPower) sounds.powerShot.play(); else sounds.normalShot.play(); }
function playExplosionSound() { if (!soundEnabled) return; sounds.boomShip.play(); }

/* ====== KALICI EKONOMİ & LEVEL SİSTEMİ ====== */
let bpcCoins = parseInt(localStorage.getItem('bpc_coins')) || 0;
let upgLife = parseInt(localStorage.getItem('bpc_upg_life')) || 0;
let upgSpeed = parseInt(localStorage.getItem('bpc_upg_speed')) || 0;
let upgShield = parseInt(localStorage.getItem('bpc_upg_shield')) || 0; 
let currentLevel = parseInt(localStorage.getItem('bpc_level')) || 1; 
let score = parseInt(localStorage.getItem('bpc_score')) || 0; // Skoru da kayıttan çek

const marketCoinsEl = document.getElementById("marketCoins");
const btnUpgLife = document.getElementById("btnUpgLife");
const btnUpgSpeed = document.getElementById("btnUpgSpeed");
const btnUpgShield = document.getElementById("btnUpgShield");

const mainLevelText = document.getElementById("mainLevelText");
const targetScoreText = document.getElementById("targetScoreText");
const currentLevelTextUI = document.getElementById("currentLevelText");
const winLevelNum = document.getElementById("winLevelNum");
const nextLevelBtn = document.getElementById("nextLevelBtn");

function getTargetScore() { return currentLevel * 500; }

function updateMarketUI() {
  marketCoinsEl.textContent = bpcCoins.toLocaleString("tr-TR");
  btnUpgLife.textContent = `Can +1 (${500 + upgLife * 500} Jeton)`;
  btnUpgSpeed.textContent = `Ateş Hızı + (${1000 + upgSpeed * 1000} Jeton)`;
  btnUpgShield.textContent = upgShield ? "Kalkan (Satın Alındı)" : "Kalkan (3000 Jeton)";
  
  btnUpgLife.disabled = bpcCoins < (500 + upgLife * 500);
  btnUpgSpeed.disabled = bpcCoins < (1000 + upgSpeed * 1000) || upgSpeed >= 5;
  btnUpgShield.disabled = upgShield ? true : (bpcCoins < 3000);

  mainLevelText.textContent = `LEVEL ${currentLevel}`;
  targetScoreText.textContent = getTargetScore();
  currentLevelTextUI.textContent = currentLevel;
}
updateMarketUI();

btnUpgLife.onclick = () => { const cost = 500 + upgLife * 500; if(bpcCoins >= cost) { bpcCoins -= cost; upgLife++; localStorage.setItem('bpc_coins', bpcCoins); localStorage.setItem('bpc_upg_life', upgLife); updateMarketUI(); } };
btnUpgSpeed.onclick = () => { const cost = 1000 + upgSpeed * 1000; if(bpcCoins >= cost && upgSpeed < 5) { bpcCoins -= cost; upgSpeed++; localStorage.setItem('bpc_coins', bpcCoins); localStorage.setItem('bpc_upg_speed', upgSpeed); updateMarketUI(); } };
btnUpgShield.onclick = () => { if(bpcCoins >= 3000 && !upgShield) { bpcCoins -= 3000; upgShield = 1; localStorage.setItem('bpc_coins', bpcCoins); localStorage.setItem('bpc_upg_shield', upgShield); updateMarketUI(); } };

function addCoins(amount) { bpcCoins += amount; localStorage.setItem('bpc_coins', bpcCoins); document.getElementById("cn").textContent = bpcCoins.toLocaleString("tr-TR"); }

/* ====== PLAYER CODE ====== */
function getPlayerCode(){ let c=localStorage.getItem("playerCode"); if(!c){c="BPC"+Math.floor(100000+Math.random()*899999);localStorage.setItem("playerCode",c);} return c; }
const myCode=getPlayerCode();
(function(){const box=document.getElementById("playerCode");if(box)box.innerHTML=`👤 Player: <b>${myCode}</b>`;})();

let playId=Math.floor(performance.now()+Math.random()*1e9);
let verifyCode="--------";
async function makeCode(){
  const t=Math.floor(Date.now()/1000); const msg=new TextEncoder().encode(playId+"|"+t+"|babypeacock");
  const buf=await crypto.subtle.digest("SHA-256",msg);
  verifyCode=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,8).toUpperCase();
}
makeCode();

/* ====== GAME SETUP ====== */
const cv=document.getElementById("game");
function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
window.addEventListener('resize', resize); 
const ctx=cv.getContext("2d"); ctx.imageSmoothingEnabled=false;

const uiLayer = document.getElementById("ui-layer"), uiPause = document.getElementById("pauseBtn");
const scEl=document.getElementById("sc"), wlEl=document.getElementById("wl"), livesEl=document.getElementById("lives"), cnEl=document.getElementById("cn");
const startOverlay=document.getElementById("startOverlay"), startBtn=document.getElementById("startBtn");

const pauseBtn=document.getElementById("pauseBtn"), pauseOverlay=document.getElementById("pauseOverlay"), resumeBtn=document.getElementById("resumeBtn");

const mondayBox = document.getElementById("mondayChampBox"), mcWeek = document.getElementById("mc-week"), mcName = document.getElementById("mc-name"), mcSecretBox = document.getElementById("winnerSecret"), mcCode = document.getElementById("mc-code");

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rand(a,b){return a+Math.random()*(b-a);}
function rectHit(a,b){return !(a.x+a.w<b.x||a.x>b.x+b.w||a.y+a.h<b.y||a.y>b.y+b.h);}
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function keyOutDark(img, TH){
  const w=img.width,h=img.height; const off=document.createElement('canvas'); off.width=w; off.height=h;
  const g=off.getContext('2d'); g.drawImage(img,0,0); const d=g.getImageData(0,0,w,h), a=d.data;
  for(let i=0;i<a.length;i+=4){ const r=a[i], g1=a[i+1], b=a[i+2]; if(r<TH && g1<TH && b<TH) a[i+3]=0; }
  g.putImageData(d,0,0); return off;
}

const PLAYER_SRC="img/player/bpc_mini.png"; const PEACOCK_SRC="yc3ku6.jpg";
const SPRITE_CONFIG = { green: { src: "bpc_enemy_green_sprite.png", frames: 60, mode: 'normal' }, ufo_red: { src: "ufo_red_sprite.png", frames: 85, mode: 'screen' }, ufo_gray: { src: "ufo_gray_sprite.png", frames: 60, mode: 'screen' }, red: { src: "bpc_enemy_red_sprite.png", frames: 60, mode: 'screen' } };

let bullets=[], enemies=[], enemyBullets=[], gems=[], coinsList=[], particles=[];
let baseLives=3, lives=3, weaponLevel=1, started=false, gameOver=false, levelWon=false, paused=false, inCountdown=false;
let fireTimer=0, elapsed=0, enT=0, gemT=0, scoreSent=false;
let player={x:cv.width/2-33,y:cv.height-120,w:66,h:66};
let countdownTimer = null;

let activeShield = 0; 
let laserActive = false;
let laserTimer = 0;
let laserCooldown = 4000;

resize();

/* YILDIZLAR VE MARS KAYALARI */
const starsA=[], starsB=[], marsRocks=[];
for(let i=0;i<30;i++) starsA.push({x:rand(0,cv.width),y:rand(0,cv.height), sp:rand(0.2,0.4), blink: rand(0.002, 0.005), off: rand(0, Math.PI*2)});
for(let i=0;i<20;i++) starsB.push({x:rand(0,cv.width),y:rand(0,cv.height), sp:rand(0.7,1.1), blink: rand(0.003, 0.007), off: rand(0, Math.PI*2)});
for(let i=0;i<15;i++) marsRocks.push({x:rand(0,cv.width),y:rand(0,cv.height), w:rand(15,45), h:rand(15,35), sp:rand(3,6)});

/* ====== BAŞLANGIÇ SİSTEMİ ====== */
function resetGameVars() {
  if(countdownTimer) clearInterval(countdownTimer);
  countOverlay.style.display="none";
  
  lives=baseLives + upgLife; weaponLevel=1; scEl.textContent=score;
  bullets=[]; enemies=[]; enemyBullets=[]; gems=[]; coinsList=[]; particles=[];
  gameOver=false; levelWon=false; started=false; scoreSent=false; paused=false; inCountdown=false; gameOverMusicPlayed = false;
  
  activeShield = upgShield > 0 ? 1 : 0;
  laserActive = false; laserTimer = 0; laserCooldown = 4000;

  if (sounds.gameOver) { sounds.gameOver.pause(); sounds.gameOver.currentTime = 0; }
  overEl.style.display="none"; top10Box.style.display="none"; uiPause.style.display="none"; levelWinOverlay.style.display="none";
  player.x = cv.width/2 - player.w/2; player.y = cv.height - 120;
}

function startCountdownSequence(callback) {
  inCountdown=true; countOverlay.style.display="flex"; let count=3;
  const showNum=(num)=>{cntText.textContent=num;cntText.style.animation='none';cntText.offsetHeight;cntText.style.animation='popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275)';};
  showNum(3);
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer=setInterval(()=>{
    count--;
    if(count>0) showNum(count);
    else if(count===0) showNum("GO!");
    else { clearInterval(countdownTimer); countOverlay.style.display="none"; inCountdown=false; if(callback) callback(); }
  },800);
}

/* SERBEST SÜRÜKLEME KONTROLLERİ */
let holding=false;
function getX(e){return (e.clientX??(e.touches?e.touches[0].clientX:0))-cv.getBoundingClientRect().left;}
function getY(e){return (e.clientY??(e.touches?e.touches[0].clientY:0))-cv.getBoundingClientRect().top;}

cv.addEventListener("pointerdown",e=>{ if(!started||paused||inCountdown||levelWon)return; holding=true; player.x=clamp(getX(e)-player.w/2,0,cv.width-player.w); player.y=clamp(getY(e)-player.h/2,0,cv.height-player.h); });
cv.addEventListener("pointermove",e=>{ if(!holding||paused||inCountdown||levelWon)return; player.x=clamp(getX(e)-player.w/2,0,cv.width-player.w); player.y=clamp(getY(e)-player.h/2,0,cv.height-player.h); });
cv.addEventListener("pointerup",()=>holding=false); cv.addEventListener("pointercancel",()=>holding=false);

function shoot(){
  playShootSound(weaponLevel > 1); const cx = player.x + player.w/2 - 2;
  if (weaponLevel === 1) { 
      bullets.push({x:cx, y:player.y, w:4, h:12, vy:-10, color:"#38bdf8"}); 
  } else if (weaponLevel === 2) { 
      bullets.push({x:cx - 8, y:player.y, w:4, h:12, vy:-10, color:"#38bdf8"}); 
      bullets.push({x:cx + 8, y:player.y, w:4, h:12, vy:-10, color:"#38bdf8"}); 
  } else { 
      bullets.push({x:cx, y:player.y, w:4, h:12, vy:-10, color:"#38bdf8"}); 
      bullets.push({x:cx - 14, y:player.y, w:4, h:12, vy:-10, color:"#38bdf8"}); 
      bullets.push({x:cx + 14, y:player.y, w:4, h:12, vy:-10, color:"#38bdf8"}); 
  }
}

function spawnGem(){ if(weaponLevel >= 3) return; const s=22; gems.push({x:rand(0,cv.width-s), y:-s, w:s, h:s, vy:1.5}); }
function explosion(x,y,count=18){ const left=Math.max(0,120-particles.length);const n=Math.min(12,left); for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=1.2+Math.random()*2.8;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:420+Math.random()*280,size:1.6+Math.random()*2.4});} }

function spawnEnemy(k, spMul){ 
  const levelSpeedMul = 1.0 + (currentLevel * 0.10); // Her level hız %10 artar
  const kind=k[Math.floor(Math.random()*k.length)]; let size=rand(48,70); 
  enemies.push({ x:rand(0,cv.width-size),y:-size,w:size,h:size,vy:rand(1.4,3) * spMul * levelSpeedMul, kind, frame:0, frameTimer:0, canShoot:(kind==="red"||kind==="green"), shootT:0,shootInt:500 }); 
}

function enemyShoot(e){ 
  if(!e.canShoot) return; const cx=e.x+e.w/2; 
  if(e.kind==="red") enemyBullets.push({x:cx-2,y:e.y+e.h,w:4,h:12,vy:6,color:"#ef4444"}); else enemyBullets.push({x:cx-1,y:e.y+e.h,w:2,h:18,vy:6.5,color:"#22c55e"}); 
}

function renderFinalScore(t){
  const cx=cv.width/2; const cy=cv.height * 0.35; 
  ctx.save();
  const grd=ctx.createRadialGradient(cx,cy,20,cx,cy,Math.max(cv.width,cv.height)/1.2);
  grd.addColorStop(0,"rgba(0,0,0,0.55)"); grd.addColorStop(1,"rgba(0,0,0,0.95)");
  ctx.fillStyle=grd; ctx.fillRect(0,0,cv.width,cv.height);
  const pw=Math.min(360,cv.width-40), ph=160, rx=cx-pw/2, ry=cy-ph/2-6;
  ctx.save(); ctx.beginPath(); ctx.rect(rx-50,ry-50,pw+100,ph+100); ctx.clip();
  ctx.translate(cx,cy); ctx.rotate(Math.sin(t / 4000) * 0.15); 
  ctx.fillStyle="rgba(0,255,200,0.15)"; const line=`Babypeacock • SCORE ${score} • CODE ${verifyCode} • `;
  ctx.font="700 13px system-ui,Arial"; for(let y=-150;y<=150;y+=22){let x=-300; while(x<300){ctx.fillText(line,x,y); x+=ctx.measureText(line).width+40;}}
  ctx.restore();
  const gradText = ctx.createLinearGradient(cx - 100, 0, cx + 100, 0); gradText.addColorStop(0, "#22d3ee"); gradText.addColorStop(1, "#34d399");
  ctx.fillStyle = gradText; ctx.font="900 26px system-ui,Arial"; ctx.textAlign="center"; ctx.shadowColor="rgba(34,211,238,0.8)"; ctx.shadowBlur=15;
  ctx.fillText("Babypeacock",cx,cy-30); ctx.shadowBlur=0;
  ctx.fillStyle="rgba(0,255,200,0.18)"; ctx.font="900 80px system-ui,Arial"; ctx.fillText(String(score),cx,cy+40);
  ctx.fillStyle="#00ffc8"; ctx.font="900 48px system-ui,Arial"; ctx.fillText(score,cx,cy+20);
  ctx.restore();
}

async function endGame(){
  if (gameOver || levelWon) return; 
  gameOver = true; uiPause.style.display = "none"; overEl.style.display = "flex"; 
  if (soundEnabled && !gameOverMusicPlayed) { gameOverMusicPlayed = true; sounds.gameOver.currentTime = 0; sounds.gameOver.volume = 1.0; sounds.gameOver.play().catch(()=>{}); }
  updateMarketUI();
  
  if(window.checkMondayWinner) window.checkMondayWinner();
  try{
    if(navigator.onLine){
      if (window.saveScore) await window.saveScore(score);
      if (window.incrementGlobalPlays) await window.incrementGlobalPlays();
      if (window.bumpLocation) await window.bumpLocation();
      if (window.flushPendingScores) window.flushPendingScores();
    } else { if (window.savePendingScore) window.savePendingScore(score); }
    if (window.showWeeklyPanel) window.showWeeklyPanel();
  }catch(e){ if (window.savePendingScore) window.savePendingScore(score); }
  top10Box.style.display="block";
}

function update(dt){
  if(!started||gameOver||paused||inCountdown||levelWon)return;
  elapsed+=dt/1000;enT+=dt;gemT+=dt;
  
  const FIRE_MS = 170 - (upgSpeed * 18); 
  fireTimer+=dt;if(holding&&fireTimer>FIRE_MS){shoot();fireTimer=0;}
  
  // ZEMİN KONTROLÜ
  if (currentLevel === 2 && !cv.classList.contains("mars-zone")) {
     cv.classList.add("mars-zone"); cv.classList.remove("red-zone");
  } else if (currentLevel > 2 && score >= getTargetScore() - 500 && !cv.classList.contains("red-zone")) {
     cv.classList.add("red-zone"); cv.classList.remove("mars-zone");
  } else if (currentLevel === 1) {
     cv.classList.remove("mars-zone", "red-zone");
  }

  // MARS KAYALARININ AKIŞI
  if (currentLevel === 2) { marsRocks.forEach(r => { r.y += r.sp; if (r.y > cv.height) { r.y = -50; r.x = rand(0, cv.width); } }); }

  if(score >= getTargetScore() && !levelWon) { triggerLevelWin(); return; }
  
  if (weaponLevel >= 3) {
    if (laserActive) {
      laserTimer -= dt;
      if (laserTimer <= 0) { laserActive = false; laserCooldown = 4000; } 
      else {
        const beamRect = { x: player.x + player.w/2 - 4, y: 0, w: 8, h: player.y };
        enemies.forEach(e => {
          if (!e.dead && rectHit(beamRect, e)) {
             playExplosionSound(); explosion(e.x+e.w/2, e.y+e.h/2, 22); e.dead = 1;
             if(!gameOver){ score++; scEl.textContent=score; if(Math.random() < 0.45) { coinsList.push({x: e.x + e.w/2 - 8, y: e.y + e.h/2, w:16, h:16, vy: 2.5}); } }
          }
        });
        enemyBullets.forEach(m => { if (!m.dead && rectHit(beamRect, m)) { m.dead = 1; explosion(m.x, m.y, 10); } });
      }
    } else {
      laserCooldown -= dt;
      if (laserCooldown <= 0) { laserActive = true; laserTimer = 1500; if(soundEnabled) sounds.powerShot.play(); }
    }
  } else { laserActive = false; laserCooldown = 4000; }

  if(enT > 600){ spawnEnemy(["ufo_red","ufo_gray","green","red"], 1.2); enT = 0; }
  if(gemT > 15000){ if(Math.random() < 0.4) spawnGem(); gemT = 0; }
  
  bullets.forEach(b=>{b.y+=b.vy;b.x+=(b.ang||0)*0.5;}); bullets=bullets.filter(b=>b.y>-20);
  
  enemies.forEach(e=>{
    e.y+=e.vy; e.shootT+=dt; if(e.canShoot&&e.shootT>=e.shootInt){e.shootT=0;enemyShoot(e);}
    const sData = loadedSprites[e.kind];
    if(sData && sData.frames > 1) { e.frameTimer += dt; if(e.frameTimer > 30) { e.frameTimer = 0; e.frame = (e.frame + 1) % sData.frames; } }
  }); 
  enemies=enemies.filter(e=>e.y<=cv.height+40);

  enemyBullets.forEach(m=>{m.y+=m.vy;}); enemyBullets=enemyBullets.filter(m=>m.y<cv.height+40);
  gems.forEach(g=>g.y+=g.vy); gems=gems.filter(g=>g.y<cv.height+40); 
  coinsList.forEach(c=>c.y+=c.vy); coinsList=coinsList.filter(c=>c.y<cv.height+40);
  
  const pBox = { x: player.x + 12, y: player.y + 12, w: player.w - 24, h: player.h - 24 };
  
  const takeDamage = () => { 
    if(activeShield > 0) {
      activeShield = 0; upgShield = 0; localStorage.setItem('bpc_upg_shield', 0); updateMarketUI(); return;
    }
    lives--; updateLives(); weaponLevel = 1; updateWeaponUI(); if(lives<=0) endGame(); 
  };

  for(const e of enemies){ if(rectHit(pBox,e)){ playExplosionSound(); explosion(player.x+player.w/2,player.y+player.h/2,22); takeDamage(); e.dead=1; } }
  for(const m of enemyBullets){ if(rectHit(pBox,m)){ playExplosionSound(); explosion(player.x+player.w/2,player.y+player.h/2,22); takeDamage(); m.dead=1; } }
  for(const b of bullets){ 
    for(const e of enemies){ 
      if(rectHit(b,e)){ 
        playExplosionSound(); explosion(e.x+e.w/2,e.y+e.h/2,16); b.dead=1; e.dead=1; 
        if(!gameOver && !levelWon){ score++; scEl.textContent=score; if(Math.random() < 0.45) { coinsList.push({x: e.x + e.w/2 - 8, y: e.y + e.h/2, w:16, h:16, vy: 2.5}); } } 
      } 
    } 
  }
  for(const g of gems){ if(rectHit(player,g)){ if(soundEnabled) sounds.gem.play(); weaponLevel = Math.min(3, weaponLevel + 1); updateWeaponUI(); g.dead=1; } } 
  for(const c of coinsList){ if(rectHit(player,c)){ if(soundEnabled) sounds.coin.play(); addCoins(25); c.dead=1; } }

  enemies=enemies.filter(o=>!o.dead); bullets=bullets.filter(o=>!o.dead); enemyBullets=enemyBullets.filter(o=>!o.dead);
  gems=gems.filter(o=>!o.dead); coinsList=coinsList.filter(o=>!o.dead);
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}p.x+=p.vx;p.y+=p.vy;p.vy+=0.02;}
}

function draw(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  
  if (currentLevel === 2) {
    // Mars tozu efektleri
    starsA.forEach(s=>{ s.y+=s.sp; if(s.y>cv.height){s.y=0;s.x=rand(0,cv.width);} ctx.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(t * s.blink + s.off)); ctx.fillStyle="rgba(251, 146, 60, 1)"; ctx.fillRect(s.x,s.y,2,2); }); 
    starsB.forEach(s=>{ s.y+=s.sp; if(s.y>cv.height){s.y=0;s.x=rand(0,cv.width);} ctx.globalAlpha = 0.6 + 0.4 * Math.abs(Math.sin(t * s.blink + s.off)); ctx.fillStyle="rgba(251, 146, 60, 1)"; ctx.fillRect(s.x,s.y,3,3); });
    ctx.globalAlpha = 1.0;
    // Mars kayaları
    ctx.fillStyle = "rgba(124, 45, 18, 0.4)";
    marsRocks.forEach(r => { ctx.fillRect(r.x, r.y, r.w, r.h); });
  } else {
    // Normal Uzay Yıldızları
    starsA.forEach(s=>{ s.y+=s.sp; if(s.y>cv.height){s.y=0;s.x=rand(0,cv.width);} ctx.globalAlpha = 0.2 + 0.8 * Math.abs(Math.sin(t * s.blink + s.off)); ctx.fillStyle="rgba(255,255,255,1)"; ctx.fillRect(s.x,s.y,1.5,1.5); }); 
    starsB.forEach(s=>{ s.y+=s.sp; if(s.y>cv.height){s.y=0;s.x=rand(0,cv.width);} ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(t * s.blink + s.off)); ctx.fillStyle="rgba(255,255,255,1)"; ctx.fillRect(s.x,s.y,2.5,2.5); });
    ctx.globalAlpha = 1.0;
  }

  if(!started && !levelWon) return; 
  
  if(!gameOver) {
    ctx.save(); ctx.globalCompositeOperation = "screen"; ctx.fillStyle = (t % 120 < 60) ? "#38bdf8" : "#818cf8"; ctx.shadowColor = "#0284c7"; ctx.shadowBlur = 15;
    const flameHeight = 15 + Math.random() * 12; ctx.beginPath(); ctx.moveTo(player.x + 22, player.y + player.h - 8); ctx.lineTo(player.x + player.w - 22, player.y + player.h - 8); ctx.lineTo(player.x + player.w / 2, player.y + player.h + flameHeight); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  
  // INCE YEŞİL LAZER ÇİZİMİ
  if (laserActive && !gameOver) {
    ctx.save(); ctx.globalCompositeOperation = "screen";
    const isFlash = Math.floor(t / 40) % 2 === 0; 
    ctx.fillStyle = isFlash ? "#4ade80" : "#ffffff";
    ctx.shadowColor = "#22c55e"; ctx.shadowBlur = 20;
    const bw = 6 + Math.random() * 4; 
    ctx.fillRect(player.x + player.w/2 - bw/2, 0, bw, player.y);
    ctx.restore();
  }

  if(activeShield > 0 && !gameOver) {
    ctx.save(); ctx.beginPath(); ctx.arc(player.x + player.w/2, player.y + player.h/2, 45, 0, Math.PI*2);
    ctx.lineWidth = 3; ctx.strokeStyle = `rgba(34, 211, 238, ${0.5 + 0.5 * Math.sin(t/150)})`; 
    ctx.shadowColor = "#22d3ee"; ctx.shadowBlur = 15; ctx.stroke();
    ctx.fillStyle = "rgba(34, 211, 238, 0.15)"; ctx.fill(); ctx.restore();
  }

  if(playerImg) ctx.drawImage(playerImg,player.x,player.y,player.w,player.h); else{ctx.fillStyle="#38bdf8";ctx.fillRect(player.x,player.y,player.w,player.h);}
  
  bullets.forEach(b=>{ctx.fillStyle=b.color||"#0099ff"; ctx.fillRect(b.x,b.y,b.w,b.h);});
  
  enemies.forEach(e=>{
    const sData = loadedSprites[e.kind];
    if(sData && sData.img) {
      if(sData.frames > 1) { 
          const frameW = sData.img.width / sData.frames; const sx = (e.frame||0) * frameW; 
          ctx.save(); 
          if(SPRITE_CONFIG[e.kind].mode === 'screen') ctx.globalCompositeOperation = "screen"; 
          if(frameW > 0 && sx >= 0) ctx.drawImage(sData.img, sx, 0, frameW, sData.img.height, e.x, e.y, e.w, e.h); 
          ctx.restore(); 
      } else { ctx.drawImage(sData.img, e.x, e.y, e.w, e.h); }
    } else { ctx.fillStyle=e.kind==="green"?"#22c55e":"#ef4444"; ctx.fillRect(e.x,e.y,e.w,e.h); }
  });

  enemyBullets.forEach(m=>{ctx.fillStyle=m.color;ctx.fillRect(m.x,m.y,m.w,m.h);});
  gems.forEach(g=>{ ctx.save(); ctx.translate(g.x+g.w/2,g.y+g.h/2); ctx.rotate(Math.sin(t/300)*0.2); ctx.fillStyle="#baf2ff"; ctx.fillRect(-g.w/2,-g.h/2,g.w,g.h); ctx.restore(); });
  coinsList.forEach(c=>{ ctx.save(); ctx.translate(c.x+c.w/2,c.y+c.h/2); ctx.rotate(t/200); ctx.shadowColor="rgba(250, 204, 21, 0.8)"; ctx.shadowBlur=10; ctx.fillStyle="#facc15"; ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h); ctx.restore(); });
  particles.forEach(p=>{const a=Math.max(0,p.life/500);ctx.globalAlpha=a;ctx.fillStyle="rgba(255,200,80,1)";ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});
  
  if(gameOver) { renderFinalScore(t); if(!scoreSent) scoreSent = true; }
}
function loop(t){const dt=Math.min(t-(window._lt||t),32);window._lt=t;update(dt);draw(t);requestAnimationFrame(loop);} requestAnimationFrame(loop);

pauseBtn.onclick=()=>{if(!started||gameOver||inCountdown||levelWon)return;paused=true;pauseOverlay.style.display="flex";uiPause.style.display="none";};
resumeBtn.onclick=()=>{pauseOverlay.style.display="none";startCountdownSequence(()=>{paused=false;uiPause.style.display="flex";});};

let playerImg=null; let loadedSprites = {};
(async function(){
  try{const p=await loadImage(PLAYER_SRC);playerImg=keyOutDark(p,80);}catch{}
  for(const key in SPRITE_CONFIG){ try{ const raw = await loadImage(SPRITE_CONFIG[key].src); loadedSprites[key] = { img: keyOutDark(raw, 90), frames: SPRITE_CONFIG[key].frames }; }catch(e){} }

</script>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, set, push, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const INSTANCE_URL="https://bpc-space-default-rtdb.europe-west1.firebasedatabase.app/";
const app=getApps().length?getApps()[0]:initializeApp({databaseURL:INSTANCE_URL}); 
const db=getDatabase(app); window.db=db;

function getLondonNow(d=new Date()){ return new Date(d.toLocaleString("en-US", { timeZone: "Europe/London" })); }
function weekKey(d=new Date()){
  const now = getLondonNow(d); const day = (now.getDay() + 6) % 7; 
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - day); startOfWeek.setHours(0,0,0,0);
  const startOfYear = getLondonNow(new Date(now.getFullYear(), 0, 1)); startOfYear.setHours(0,0,0,0);
  const diff = startOfWeek - startOfYear; const weekNumber = Math.floor(diff / (7*24*60*60*1000)) + 1;
  return `${now.getFullYear()}-W${String(weekNumber).padStart(2,"0")}`;
}
function getFlagEmoji(c){if(!c)return"🏳️";const cp=c.toUpperCase().split('').map(char=>127397+char.charCodeAt());return String.fromCodePoint(...cp);}
function getCountryCode(){
  try{
    const lang=(navigator.languages&&navigator.languages[0])||navigator.language||"en-US";
    let country = (lang.split('-')[1] || "").toUpperCase();
    if (!country || country.length !== 2) {
        const code = lang.split('-')[0].toLowerCase();
        const map = { ar:'SA', en:'US', fr:'FR', de:'DE', es:'ES', it:'IT', pt:'BR', ru:'RU', zh:'CN', ja:'JP', ko:'KR', tr:'TR', nl:'NL', hi:'IN', sv:'SE', no:'NO', da:'DK', pl:'PL', cs:'CZ', sk:'SK', ro:'RO', hu:'HU', fi:'FI', el:'GR', id:'ID', th:'TH', vi:'VN', uk:'UA', bg:'BG', sr:'RS', hr:'HR', ms:'MY', he:'IL' };
        country = map[code] || "TR";
    }
    if (country === "UK") country = "GB"; return country;
  }catch{return"TR";}
}
function getLondonNowCompat(){ return getLondonNow(new Date()); }

function savePendingScore(score){
  const code = localStorage.getItem("playerCode") || "BPC"; const country = getCountryCode(); const wk = weekKey(new Date());
  const item = { code, score, ts: Date.now(), country, week: wk };
  const old = JSON.parse(localStorage.getItem("pendingScores") || "[]"); old.push(item); localStorage.setItem("pendingScores", JSON.stringify(old));
}

async function flushPendingScores(){
  try{
    const pending = JSON.parse(localStorage.getItem("pendingScores") || "[]"); if(pending.length === 0) return;
    for(const p of pending){ await push(ref(db, "scores"), { code: p.code, score: p.score, ts: p.ts, country: p.country }); await push(ref(db, `scoresWeekly/${p.week}`), { code: p.code, score: p.score, ts: p.ts, country: p.country, week: p.week }); }
    localStorage.removeItem("pendingScores");
  }catch(e){}
}
window.addEventListener("online", flushPendingScores);
if(navigator.onLine){ flushPendingScores(); }
window.savePendingScore = savePendingScore; window.flushPendingScores = flushPendingScores;

const refCounter=ref(db,"stats/globalPlays"); const elGC=document.getElementById("globalCounter");
const cached=Number(localStorage.getItem("bpc_global_plays"))||0; if(elGC)elGC.textContent=cached?cached.toLocaleString("en-US"):"…";
onValue(refCounter,s=>{const v=Number(s.val()??0);if(elGC)elGC.textContent=v.toLocaleString("en-US");localStorage.setItem("bpc_global_plays",String(v));});
function incrementGlobalPlays(){return runTransaction(refCounter,v=>(v||0)+1);}

async function bumpLocation(){ try{ const code = getCountryCode(); const locRef = ref(db, `stats/locations/${code}`); await runTransaction(locRef, v => (v||0) + 1); }catch(e){} }
(async function bumpLocationOncePerDay(){
  try{ const tk="bpc_loc_day"; const td=new Date().toISOString().slice(0,10); if(localStorage.getItem(tk)===td)return;
    await bumpLocation(); const tr=ref(db,"stats/totalStarts"); await runTransaction(tr,v=>(v||0)+1); localStorage.setItem(tk,td);
  }catch(e){}
})();

async function saveScore(score){
  const code=localStorage.getItem("playerCode")||"BPC"; const country=getCountryCode(); 
  const payload={code,score,ts:Date.now(),country, countryName: country};
  await push(ref(db,"scores"),payload); const wk=weekKey(new Date()); await push(ref(db,`scoresWeekly/${wk}`),{...payload,week:wk});
}

async function getWeeklyTop10(wk=weekKey()){
  const snap=await get(ref(db,`scoresWeekly/${wk}`)); const bestByCode={};
  snap.forEach(ch=>{
    const v=ch.val(); if(!v||typeof v.score!=="number") return;
    if(!bestByCode[v.code] || v.score>bestByCode[v.code].score){ bestByCode[v.code]=v; }
  });
  return Object.values(bestByCode).sort((a,b)=>b.score-a.score).slice(0,20);
}

async function checkMondayWinner(){
  const now = getLondonNow(new Date()); const londonDay = now.getDay(); const isMondayActive = londonDay === 1;
  mondayBox.style.display = 'none'; if(!isMondayActive) return;
  const d_prev = new Date(now); d_prev.setDate(d_prev.getDate() - 1); const prevWk = weekKey(d_prev);
  const list = await getWeeklyTop10(prevWk); if(!list || list.length === 0) return;
  const winner = list[0]; const myCode = localStorage.getItem("playerCode");
  mondayBox.style.display = 'flex'; mcWeek.textContent = prevWk.split("-W")[1]; mcName.textContent = getFlagEmoji(winner.country) + " " + winner.code;
  if(myCode === winner.code){
    const winRef = ref(db, `weeklyWinners/${prevWk}`); const snapshot = await get(winRef);
    let secret = "";
    if(snapshot.exists() && snapshot.val().secretCode){ secret = snapshot.val().secretCode; } 
    else { secret = "WIN-" + Math.floor(100000 + Math.random() * 900000); await set(winRef, { secretCode: secret, winnerCode: winner.code, country: winner.country, score: winner.score, ts: Date.now() }); }
    mcSecretBox.style.display = "block"; mcCode.textContent = secret;
  } else { mcSecretBox.style.display = "none"; }
}
window.checkMondayWinner = checkMondayWinner;

async function showWeeklyPanel(){
  const wk=weekKey(new Date()); const me=localStorage.getItem("playerCode");
  const ol=document.getElementById("bpc-list"); const box=document.getElementById("bpc-top10"); const wnEl=document.getElementById("wk-num");
  if(wnEl) wnEl.textContent=wk.split("-W")[1];
  if(window.bpcTimer) clearInterval(window.bpcTimer);

  function updateTimer(){
    const now = getLondonNowCompat(); const target = new Date(now); const day = target.getDay(); const daysUntilSunday = (7 - day) % 7;
    target.setDate(now.getDate() + daysUntilSunday); target.setHours(23, 59, 59, 999);
    const diff = target - now; const remEl = document.getElementById("wk-rem"); if(!remEl) return;
    if(diff<=0){ remEl.textContent="Resetting..."; return; }
    const d=Math.floor(diff/(1000*60*60*24)); const h=Math.floor((diff%(1000*60*60*24))/(1000*60*60)); const m=Math.floor((diff%(1000*60*60))/(1000*60)); const s=Math.floor((diff%(1000*60))/1000);
    remEl.textContent=`${d}d ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    remEl.style.color=(d===0)?"#ef4444":"#facc15";
  }
  updateTimer(); window.bpcTimer=setInterval(updateTimer,1000);

  const list=await getWeeklyTop10(wk); const medals = ["🥇","🥈","🥉"]; 
  if(ol){
    ol.innerHTML = list.length
      ? list.map((it,i)=>{
          const mine = it.code===me; const flag = getFlagEmoji(it.country); const medal = medals[i] || ""; 
          return `<li class="${mine?'me':''}">
            <div class="li-info"><span class="rank-num">${i+1}.</span>${flag} ${it.code} → ${it.score} pts</div>
            <div class="li-medal">${medal}</div>
          </li>`;
        }).join("")
      : `<div style="opacity:.7;text-align:center">No scores this week yet.</div>`;
  }
  if(box) box.style.display="block";
}

window.incrementGlobalPlays = incrementGlobalPlays; window.saveScore = saveScore;
window.showWeeklyPanel = showWeeklyPanel; window.bumpLocation = bumpLocation;
</script>
