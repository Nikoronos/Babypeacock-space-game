<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Babypeacock — BPC Space Game</title>
<style>
  html,body{margin:0;height:100%;background:#000;font-family:system-ui,Segoe UI,Roboto,Arial;overflow:hidden}
  
  /* --- UI DÜZENİ --- */
  #ui-layer {
    position: fixed; top: 0; left: 0; right: 0;
    height: 55px;
    padding: max(10px, env(safe-area-inset-top)) 15px 0 15px;
    display: none; 
    display: grid;
    grid-template-columns: auto 1fr auto; 
    align-items: center;
    z-index: 20; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    font-size: 15px; font-weight: 800;
    white-space: nowrap; 
  }

  #brand {
    justify-self: start; 
    background:linear-gradient(90deg,#22d3ee,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight: 900; font-size: 17px; 
    text-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
  }

  .center-group {
    justify-self: center; 
    display: flex; flex-direction: row; align-items: center; 
    gap: 15px; 
  }
  
  #score { color:#00ffc8; text-shadow: 0 0 6px rgba(0, 255, 200, 0.5); font-size: 18px; }
  #lives { letter-spacing: 2px; font-size: 15px; text-shadow: 0 0 5px rgba(255, 50, 50, 0.4); min-width: 60px; text-align: center; }

  #economyUI { 
    justify-self: end; 
    display: flex; flex-direction: column; align-items: flex-end;
  }
  #coins { color:#facc15; text-shadow: 0 0 6px rgba(250, 204, 21, 0.5); font-size: 16px; margin-bottom: 2px;}
  #weaponLvl { color:#a7f3d0; text-shadow: 0 0 6px rgba(167, 243, 208, 0.5); font-size: 12px; }

  #pauseBtn{
    display:none; position:fixed;left:50%;transform:translateX(-50%);
    bottom:max(20px,env(safe-area-inset-bottom)); 
    z-index:50;
    width:42px;height:42px; 
    background:rgba(15, 23, 42, 0.95); border:2px solid #38bdf8; color:#38bdf8; border-radius:50%;
    font-size:14px;font-weight:900;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 0 10px rgba(56,189,248,0.4); 
  }

  #startOverlay,#gameOver,#pauseOverlay,#countdownOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:60}
  #startOverlay{background:rgba(0,0,0,0.85);color:#fff;display:flex;overflow:hidden}
  
  #pauseOverlay{background:rgba(0,0,0,0.9);color:#fff;}
  
  #startLogo {
    width: 90px; height: 90px; border-radius: 50%; border: 3px solid #22d3ee;
    box-shadow: 0 0 25px rgba(34, 211, 238, 0.5), inset 0 0 10px rgba(34, 211, 238, 0.3);
    object-fit: cover; margin-bottom: 8px; animation: floatLogo 3.5s ease-in-out infinite;
  }
  @keyframes floatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .slogan { font-size: 15px; font-style: italic; background: linear-gradient(90deg, #a7f3d0, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 600; letter-spacing: 0.5px; text-shadow: 0 0 10px rgba(34, 211, 238, 0.2); }
  
  /* --- MARKET UI --- */
  #marketPanel { background: rgba(15, 23, 42, 0.8); border: 1px solid #38bdf8; border-radius: 10px; padding: 12px; margin: 15px 0; width: 280px; text-align: center; box-shadow: 0 0 15px rgba(56,189,248,0.2); }
  .market-title { color: #facc15; font-size: 14px; margin-bottom: 8px; font-weight: bold; }
  .upg-btn { background: #020617; border: 1px solid #facc15; color: #facc15; border-radius: 6px; padding: 8px; width: 100%; margin-bottom: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
  .upg-btn:active { background: #facc15; color: #000; }
  .upg-btn:disabled { border-color: #555; color: #555; cursor: not-allowed; background: transparent; }

  #gameOver { background: transparent; justify-content: flex-start; padding-top: 40vh; overflow-y: auto; }
  #countdownOverlay{background:transparent;pointer-events:none;z-index:70}
  #cntText{font-size:90px;font-weight:900;color:#fff;text-shadow:0 0 25px #22d3ee;font-family:monospace}
  @keyframes popIn{from{transform:scale(0.5);opacity:0}to{transform:scale(1);opacity:1}}
  .btn{padding:12px 32px;border:1px solid #00ffc8;background:#0b1220;color:#00ffc8;border-radius:12px;font-weight:900;z-index:60;font-size:16px;cursor:pointer;margin-bottom:5px;box-shadow:0 0 20px rgba(0,255,200,0.4);}
  
  #soundToggle { position:absolute; bottom: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(34, 211, 238, 0.5); background: rgba(15, 23, 42, 0.9); color: #22d3ee; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100; }
  
  canvas { 
    display: block; margin: 0 auto; 
    background: radial-gradient(circle at center, #0f172a 0%, #020617 60%, #000000 100%); 
    touch-action: none; user-select: none; width: 100%; height: 100%;
    transition: background 3.5s ease-in-out;
  }
  .red-zone { background: radial-gradient(circle at center, #2e1065 0%, #0f172a 60%, #000000 100%) !important; }

</style>
</head>
<body>
  <div id="ui-layer">
    <div id="brand">Babypeacock 🦚</div>
    <div class="center-group">
      <div id="score">Score: <span id="sc">0</span></div>
      <div id="lives">❤️❤️❤️</div>
    </div>
    <div id="economyUI">
      <div id="coins">💰 <span id="cn">0</span></div>
      <div id="weaponLvl">WPN LVL <span id="wl">1</span></div>
    </div>
  </div>

  <div id="pauseBtn">II</div>

  <div id="startOverlay">
    <img id="startLogo" src="yc3ku6.jpg" alt="BPC Logo">
    <div class="slogan">From feather to flight</div>
    
    <div id="marketPanel">
      <div class="market-title">BPC Jeton: <span id="marketCoins">0</span></div>
      <button id="btnUpgLife" class="upg-btn">Can +1 (500 Jeton)</button>
      <button id="btnUpgSpeed" class="upg-btn">Ateş Hızı + (1000 Jeton)</button>
    </div>

    <button id="startBtn" class="btn">START GAME</button>
    <div style="margin-top:12px;font-size:12px;color:#ccc;">Serbest sürükleme aktiftir (Yukarı/Aşağı/Sağa/Sola)</div>
    <div id="soundToggle">🔊</div>
  </div>

  <div id="pauseOverlay">
    <div style="font-size:32px;font-weight:900;margin-bottom:15px;color:#e2e8f0;letter-spacing:2px;">PAUSED</div>
    <button id="resumeBtn" class="btn">RESUME</button>
  </div>

  <div id="countdownOverlay"><div id="cntText"></div></div>

  <div id="gameOver">
    <button id="restart" class="btn">Restart</button>
  </div>

  <canvas id="game"></canvas>
<script>
/* ====== SES SİSTEMİ ====== */
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

class SoundPool {
  constructor(src, size, volume = 1.0) {
    this.buffer = null; this.volume = volume; this.isLoaded = false;
    fetch(src).then(r => r.arrayBuffer()).then(ab => audioCtx.decodeAudioData(ab))
      .then(b => { this.buffer = b; this.isLoaded = true; }).catch(e => console.error("Ses hatası:", src, e));
  }
  play() {
    if (!this.isLoaded) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    try {
      const source = audioCtx.createBufferSource(); source.buffer = this.buffer;
      const gainNode = audioCtx.createGain(); gainNode.gain.value = this.volume;
      source.connect(gainNode); gainNode.connect(audioCtx.destination); source.start(0);
    } catch (e) {}
  }
}

const sounds = {
  normalShot: new SoundPool("laser_one.mp3", 10, 0.25), 
  powerShot:  new SoundPool("laser.mp3", 10, 0.25),   
  boomUfo:    new SoundPool("boom.mp3", 5, 0.6),
  boomShip:   new SoundPool("boom_one.mp3", 5, 0.6),
  gem:        new SoundPool("gem.mp3", 5, 0.7),
  coin:       new SoundPool("gem.mp3", 5, 0.4), // Jeton sesi (elmasla aynı ama kısık)
  gameOver:   new Audio("space_chords.mp3")
};
sounds.gameOver.loop = false; let gameOverMusicPlayed = false;

let soundEnabled = localStorage.getItem("bpc_sound") !== "0";
const soundBtn = document.getElementById("soundToggle");
function updateSoundIcon() {
  soundBtn.textContent = soundEnabled ? "🔊" : "🔇";
  soundBtn.style.opacity = soundEnabled ? "1" : "0.5";
}
updateSoundIcon();
soundBtn.onclick = (e) => { e.stopPropagation(); soundEnabled = !soundEnabled; localStorage.setItem("bpc_sound", soundEnabled ? "1" : "0"); updateSoundIcon(); };

function playShootSound(isPower) { if (!soundEnabled) return; if (isPower) sounds.powerShot.play(); else sounds.normalShot.play(); }
function playExplosionSound() { if (!soundEnabled) return; sounds.boomShip.play(); }

/* ====== KALICI EKONOMİ & YÜKSELTMELER ====== */
let bpcCoins = parseInt(localStorage.getItem('bpc_coins')) || 0;
let upgLife = parseInt(localStorage.getItem('bpc_upg_life')) || 0;
let upgSpeed = parseInt(localStorage.getItem('bpc_upg_speed')) || 0;

const marketCoinsEl = document.getElementById("marketCoins");
const btnUpgLife = document.getElementById("btnUpgLife");
const btnUpgSpeed = document.getElementById("btnUpgSpeed");

function updateMarketUI() {
  marketCoinsEl.textContent = bpcCoins.toLocaleString("tr-TR");
  btnUpgLife.textContent = `Can +1 (${500 + upgLife * 500} Jeton)`;
  btnUpgSpeed.textContent = `Ateş Hızı + (${1000 + upgSpeed * 1000} Jeton)`;
  
  btnUpgLife.disabled = bpcCoins < (500 + upgLife * 500);
  btnUpgSpeed.disabled = bpcCoins < (1000 + upgSpeed * 1000) || upgSpeed >= 5; // Hız max 5 level
}
updateMarketUI();

btnUpgLife.onclick = () => {
  const cost = 500 + upgLife * 500;
  if(bpcCoins >= cost) { bpcCoins -= cost; upgLife++; localStorage.setItem('bpc_coins', bpcCoins); localStorage.setItem('bpc_upg_life', upgLife); updateMarketUI(); }
};
btnUpgSpeed.onclick = () => {
  const cost = 1000 + upgSpeed * 1000;
  if(bpcCoins >= cost && upgSpeed < 5) { bpcCoins -= cost; upgSpeed++; localStorage.setItem('bpc_coins', bpcCoins); localStorage.setItem('bpc_upg_speed', upgSpeed); updateMarketUI(); }
};

function addCoins(amount) {
  bpcCoins += amount; localStorage.setItem('bpc_coins', bpcCoins); document.getElementById("cn").textContent = bpcCoins.toLocaleString("tr-TR");
}

/* ====== GAME SETUP ====== */
const cv=document.getElementById("game");
function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
window.addEventListener('resize', resize); 
const ctx=cv.getContext("2d"); ctx.imageSmoothingEnabled=false;

const uiLayer = document.getElementById("ui-layer"), uiPause = document.getElementById("pauseBtn");
const scEl=document.getElementById("sc"), wlEl=document.getElementById("wl"), livesEl=document.getElementById("lives"), cnEl=document.getElementById("cn");
const startOverlay=document.getElementById("startOverlay"), startBtn=document.getElementById("startBtn");
const overEl=document.getElementById("gameOver"), restartBtn=document.getElementById("restart");
const pauseBtn=document.getElementById("pauseBtn"), pauseOverlay=document.getElementById("pauseOverlay"), resumeBtn=document.getElementById("resumeBtn");
const countOverlay=document.getElementById("countdownOverlay"), cntText=document.getElementById("cntText");

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rand(a,b){return a+Math.random()*(b-a);}
function rectHit(a,b){return !(a.x+a.w<b.x||a.x>b.x+b.w||a.y+a.h<b.y||a.y>b.y+b.h);}
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function keyOutDark(img, TH){
  const w=img.width,h=img.height; const off=document.createElement('canvas'); off.width=w; off.height=h;
  const g=off.getContext('2d'); g.drawImage(img,0,0); const d=g.getImageData(0,0,w,h), a=d.data;
  for(let i=0;i<a.length;i+=4){ const r=a[i], g1=a[i+1], b=a[i+2]; if(r<TH && g1<TH && b<TH) a[i+3]=0; }
  g.putImageData(d,0,0); return off;
}

const PLAYER_SRC="img/player/bpc_mini.png"; const PEACOCK_SRC="yc3ku6.jpg";
const SPRITE_CONFIG = { green: { src: "bpc_enemy_green_sprite.png", frames: 60, mode: 'normal' }, ufo_red: { src: "ufo_red_sprite.png", frames: 85, mode: 'screen' }, ufo_gray: { src: "ufo_gray_sprite.png", frames: 60, mode: 'screen' }, red: { src: "bpc_enemy_red_sprite.png", frames: 60, mode: 'screen' } };

let bullets=[], enemies=[], enemyBullets=[], gems=[], coinsList=[], mascots=[], particles=[];
let score=0, baseLives=3, lives=3, weaponLevel=1, started=false, gameOver=false, paused=false, inCountdown=false;
let fireTimer=0;
let elapsed=0,enT=0,gemT=0;
let player={x:cv.width/2-33,y:cv.height-120,w:66,h:66};
resize();

/* YANIP SÖNEN YILDIZLAR SİSTEMİ (Twinkling) */
const starsA=[], starsB=[];
for(let i=0;i<30;i++) starsA.push({x:rand(0,cv.width),y:rand(0,cv.height), sp:rand(0.2,0.4), blink: rand(0.002, 0.005), off: rand(0, Math.PI*2)});
for(let i=0;i<20;i++) starsB.push({x:rand(0,cv.width),y:rand(0,cv.height), sp:rand(0.7,1.1), blink: rand(0.003, 0.007), off: rand(0, Math.PI*2)});

function startCountdownSequence(callback) {
  inCountdown=true; countOverlay.style.display="flex"; let count=3;
  const showNum=(num)=>{cntText.textContent=num;cntText.style.animation='none';cntText.offsetHeight;cntText.style.animation='popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275)';};
  showNum(3);
  const timer=setInterval(()=>{count--;if(count>0)showNum(count);else if(count===0)showNum("GO!");else{clearInterval(timer);countOverlay.style.display="none";inCountdown=false;if(callback)callback();}},800);
}

function initGame(){
  if(started)return;
  startOverlay.style.display="none"; uiLayer.style.display = "grid"; 
  lives = baseLives + upgLife; updateLives(); weaponLevel = 1; updateWeaponUI();
  cnEl.textContent = bpcCoins.toLocaleString("tr-TR");
  startCountdownSequence(()=>{started=true; paused=false; uiPause.style.display="flex"; player.y=cv.height-120; player.x=cv.width/2-player.w/2;});
}
startBtn.onclick=initGame;
pauseBtn.onclick=()=>{if(!started||gameOver||inCountdown)return;paused=true;pauseOverlay.style.display="flex";uiPause.style.display="none";};
resumeBtn.onclick=()=>{pauseOverlay.style.display="none";startCountdownSequence(()=>{paused=false;uiPause.style.display="flex";});};

function updateLives(){livesEl.innerHTML="❤️".repeat(lives);} 
function updateWeaponUI(){wlEl.textContent=weaponLevel;}

/* SERBEST SÜRÜKLEME KONTROLLERİ (Tam Eksen X ve Y) */
let holding=false;
function getX(e){return (e.clientX??(e.touches?e.touches[0].clientX:0))-cv.getBoundingClientRect().left;}
function getY(e){return (e.clientY??(e.touches?e.touches[0].clientY:0))-cv.getBoundingClientRect().top;}

cv.addEventListener("pointerdown",e=>{
  if(!started||paused||inCountdown)return; holding=true;
  player.x=clamp(getX(e)-player.w/2,0,cv.width-player.w);
  player.y=clamp(getY(e)-player.h/2,0,cv.height-player.h);
});
cv.addEventListener("pointermove",e=>{
  if(!holding||paused||inCountdown)return;
  player.x=clamp(getX(e)-player.w/2,0,cv.width-player.w);
  player.y=clamp(getY(e)-player.h/2,0,cv.height-player.h);
});
cv.addEventListener("pointerup",()=>holding=false); cv.addEventListener("pointercancel",()=>holding=false);

function shoot(){
  playShootSound(weaponLevel > 1);
  const cx = player.x + player.w/2 - 2;
  // Aşamalı Silah Evrimi (Seviyeye Göre Mermi Atışı)
  if (weaponLevel === 1) {
    bullets.push({x:cx, y:player.y, w:4, h:12, vy:-10});
  } else if (weaponLevel === 2) {
    bullets.push({x:cx - 8, y:player.y, w:4, h:12, vy:-10});
    bullets.push({x:cx + 8, y:player.y, w:4, h:12, vy:-10});
  } else {
    bullets.push({x:cx, y:player.y, w:4, h:12, vy:-10});
    bullets.push({x:cx, y:player.y, w:4, h:12, vy:-10, ang: 3});
    bullets.push({x:cx, y:player.y, w:4, h:12, vy:-10, ang: -3});
  }
}

function spawnGem(){ if(weaponLevel >= 3) return; const s=22; gems.push({x:rand(0,cv.width-s), y:-s, w:s, h:s, vy:1.5}); }
function explosion(x,y,count=18){
  const left=Math.max(0,120-particles.length);const n=Math.min(12,left);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=1.2+Math.random()*2.8;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:420+Math.random()*280,size:1.6+Math.random()*2.4});}
}

function spawnEnemy(k, spMul){ 
  const kind=k[Math.floor(Math.random()*k.length)]; 
  let size=rand(48,70); 
  let img = null, frames = 1, blendMode = 'normal';
  if (loadedSprites[kind]) { img = loadedSprites[kind].img; frames = loadedSprites[kind].frames; blendMode = SPRITE_CONFIG[kind].mode || 'normal'; }
  enemies.push({ x:rand(0,cv.width-size),y:-size,w:size,h:size,vy:rand(1.4,3) * spMul, kind, img, isSprite:(frames>1), blendMode, frame:0, frameTimer:0, totalFrames: frames, canShoot:(kind==="red"||kind==="green"), shootT:0,shootInt:500 }); 
}

function enemyShoot(e){ 
  if(!e.canShoot) return; const cx=e.x+e.w/2; 
  if(e.kind==="red") enemyBullets.push({x:cx-2,y:e.y+e.h,w:4,h:12,vy:6,color:"#ef4444"});
  else enemyBullets.push({x:cx-1,y:e.y+e.h,w:2,h:18,vy:6.5,color:"#22c55e"}); 
}

function renderFinalScore(t){
  const cx=cv.width/2; const cy=cv.height * 0.35; 
  ctx.save(); ctx.fillStyle="rgba(0,0,0,0.85)"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#00ffc8"; ctx.font="900 48px system-ui,Arial"; ctx.textAlign="center";
  ctx.fillText("Game Over",cx,cy); ctx.font="900 24px system-ui,Arial"; ctx.fillText("Score: " + score,cx,cy+40);
  ctx.restore();
}

async function endGame(){
  if (gameOver) return;
  gameOver = true; uiPause.style.display = "none"; overEl.style.display = "flex"; 
  if (soundEnabled && !gameOverMusicPlayed) { gameOverMusicPlayed = true; sounds.gameOver.play(); }
  updateMarketUI(); // Oyun bitince market UI'ı yenile (paralar güncellenmiş olabilir)
}

function update(dt){
  if(!started||gameOver||paused||inCountdown)return;
  
  elapsed+=dt/1000;enT+=dt;gemT+=dt;
  
  // Ateş hızı yükseltmesine göre atış sıklığını hesapla (max seviyede çok daha seri)
  const FIRE_MS = 170 - (upgSpeed * 18); 
  fireTimer+=dt;if(holding&&fireTimer>FIRE_MS){shoot();fireTimer=0;}
  
  if(enT > 600){ spawnEnemy(["ufo_red","ufo_gray","green","red"], 1.2); enT = 0; }
  if(gemT > 15000){ if(Math.random() < 0.4) spawnGem(); gemT = 0; }
  
  bullets.forEach(b=>{b.y+=b.vy;b.x+=(b.ang||0)*0.5;}); bullets=bullets.filter(b=>b.y>-20);
  
  enemies.forEach(e=>{
    e.y+=e.vy; e.shootT+=dt; if(e.canShoot&&e.shootT>=e.shootInt){e.shootT=0;enemyShoot(e);}
    if(e.isSprite && e.img) { e.frameTimer += dt; if(e.frameTimer > 30) { e.frameTimer = 0; e.frame = (e.frame + 1) % e.totalFrames; } }
  }); 
  enemies=enemies.filter(e=>e.y<=cv.height+40);

  enemyBullets.forEach(m=>{m.y+=m.vy;}); enemyBullets=enemyBullets.filter(m=>m.y<cv.height+40);
  gems.forEach(g=>g.y+=g.vy); gems=gems.filter(g=>g.y<cv.height+40); 
  coinsList.forEach(c=>c.y+=c.vy); coinsList=coinsList.filter(c=>c.y<cv.height+40);
  
  const pBox = { x: player.x + 12, y: player.y + 12, w: player.w - 24, h: player.h - 24 };

  // Düşmana ve mermiye çarpma (Can ve Silah Seviyesi düşüşü)
  const takeDamage = () => {
    lives--; updateLives(); weaponLevel = 1; updateWeaponUI(); // Silah seviyesi sıfırlanır
    if(lives<=0) endGame();
  };

  for(const e of enemies){
    if(rectHit(pBox,e)){ playExplosionSound(); explosion(player.x+player.w/2,player.y+player.h/2,22); takeDamage(); e.dead=1; }
  }
  for(const m of enemyBullets){
    if(rectHit(pBox,m)){ playExplosionSound(); explosion(player.x+player.w/2,player.y+player.h/2,22); takeDamage(); m.dead=1; }
  }
  for(const b of bullets){ 
    for(const e of enemies){ 
      if(rectHit(b,e)){ 
        playExplosionSound(); explosion(e.x+e.w/2,e.y+e.h/2,16); b.dead=1; e.dead=1; 
        if(!gameOver){ 
          score++; scEl.textContent=score; 
          // %30 ihtimalle jeton düşür
          if(Math.random() < 0.3) { coinsList.push({x: e.x + e.w/2 - 8, y: e.y + e.h/2, w:16, h:16, vy: 2.5}); }
        } 
      } 
    } 
  }
  for(const g of gems){ if(rectHit(player,g)){ if(soundEnabled) sounds.gem.play(); weaponLevel = Math.min(3, weaponLevel + 1); updateWeaponUI(); g.dead=1; } } 
  for(const c of coinsList){ if(rectHit(player,c)){ if(soundEnabled) sounds.coin.play(); addCoins(10); c.dead=1; } }

  enemies=enemies.filter(o=>!o.dead); bullets=bullets.filter(o=>!o.dead); enemyBullets=enemyBullets.filter(o=>!o.dead);
  gems=gems.filter(o=>!o.dead); coinsList=coinsList.filter(o=>!o.dead);
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}p.x+=p.vx;p.y+=p.vy;p.vy+=0.02;}

  if(score >= 1500 && !cv.classList.contains("red-zone")) cv.classList.add("red-zone");
}

function draw(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  
  // YANIP SÖNEN YILDIZLAR (Twinkling Effect)
  starsA.forEach(s=>{
    s.y+=s.sp; if(s.y>cv.height){s.y=0;s.x=rand(0,cv.width);}
    ctx.globalAlpha = 0.2 + 0.8 * Math.abs(Math.sin(t * s.blink + s.off));
    ctx.fillStyle="rgba(255,255,255,1)"; ctx.fillRect(s.x,s.y,1.5,1.5);
  }); 
  starsB.forEach(s=>{
    s.y+=s.sp; if(s.y>cv.height){s.y=0;s.x=rand(0,cv.width);}
    ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(t * s.blink + s.off));
    ctx.fillStyle="rgba(255,255,255,1)"; ctx.fillRect(s.x,s.y,2.5,2.5);
  });
  ctx.globalAlpha = 1.0;

  if(!started) return;
  
  // DİNAMİK MAVİ EGZOZ ATEŞİ
  if(!gameOver) {
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    // Egzoz alevinin titremesini zaman (t) bazlı yapıyoruz
    ctx.fillStyle = (t % 120 < 60) ? "#38bdf8" : "#818cf8"; 
    ctx.shadowColor = "#0284c7";
    ctx.shadowBlur = 15;
    const flameHeight = 15 + Math.random() * 12; // Alev boyutu dalgalansın
    ctx.beginPath();
    ctx.moveTo(player.x + 22, player.y + player.h - 8); // Sol dip
    ctx.lineTo(player.x + player.w - 22, player.y + player.h - 8); // Sağ dip
    ctx.lineTo(player.x + player.w / 2, player.y + player.h + flameHeight); // Uç noktası
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Gemi çizimi
  if(playerImg) ctx.drawImage(playerImg,player.x,player.y,player.w,player.h); else{ctx.fillStyle="#38bdf8";ctx.fillRect(player.x,player.y,player.w,player.h);}
  
  ctx.fillStyle="#0099ff"; bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
  enemies.forEach(e=>{
    if(e.isSprite && e.img && e.totalFrames > 0) {
      const frameW = e.img.width / e.totalFrames; const sx = e.frame * frameW;
      ctx.save(); if(e.blendMode === 'screen') ctx.globalCompositeOperation = "screen";
      if(frameW > 0 && sx >= 0) ctx.drawImage(e.img, sx, 0, frameW, e.img.height, e.x, e.y, e.w, e.h);
      ctx.restore();
    } else if(e.img) { ctx.drawImage(e.img, e.x, e.y, e.w, e.h); } 
    else { ctx.fillStyle=e.kind==="green"?"#22c55e":"#ef4444"; ctx.fillRect(e.x,e.y,e.w,e.h); }
  });
  enemyBullets.forEach(m=>{ctx.fillStyle=m.color;ctx.fillRect(m.x,m.y,m.w,m.h);});
  
  // Elmas ve Jeton Çizimi
  gems.forEach(g=>{
    ctx.save(); ctx.translate(g.x+g.w/2,g.y+g.h/2); ctx.rotate(Math.sin(t/300)*0.2);
    ctx.fillStyle="#baf2ff"; ctx.fillRect(-g.w/2,-g.h/2,g.w,g.h); ctx.restore();
  });
  coinsList.forEach(c=>{
    ctx.save(); ctx.translate(c.x+c.w/2,c.y+c.h/2); ctx.rotate(t/200);
    ctx.shadowColor="rgba(250, 204, 21, 0.8)"; ctx.shadowBlur=10;
    ctx.fillStyle="#facc15"; ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h); ctx.restore();
  });

  particles.forEach(p=>{const a=Math.max(0,p.life/500);ctx.globalAlpha=a;ctx.fillStyle="rgba(255,200,80,1)";ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});
  if(gameOver) renderFinalScore(t);
}
function loop(t){const dt=Math.min(t-(window._lt||t),32);window._lt=t;update(dt);draw(t);requestAnimationFrame(loop);} requestAnimationFrame(loop);

restartBtn.onclick=()=>{
  score=0; scEl.textContent=0; bullets=[]; enemies=[]; enemyBullets=[]; gems=[]; coinsList=[]; particles=[];
  gameOver=false; paused=false; inCountdown=false; gameOverMusicPlayed = false;
  if (sounds.gameOver) { sounds.gameOver.pause(); sounds.gameOver.currentTime = 0; }
  overEl.style.display="none"; uiPause.style.display="none";
  // Restartta gemiyi merkeze al
  player.x = cv.width/2 - player.w/2; player.y = cv.height - 120;
  initGame(); // Canı ve silahı baştan kurar
  if(cv.classList.contains("red-zone")) cv.classList.remove("red-zone");
};

let playerImg=null; let loadedSprites = {};
(async function(){
  try{const p=await loadImage(PLAYER_SRC);playerImg=keyOutDark(p,80);}catch{}
  for(const key in SPRITE_CONFIG){
    try{ const raw = await loadImage(SPRITE_CONFIG[key].src); loadedSprites[key] = { img: keyOutDark(raw, 90), frames: SPRITE_CONFIG[key].frames }; }catch(e){}
  }
})();
</script>
